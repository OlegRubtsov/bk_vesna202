[env:esp32-c3-oled]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  olikraus/U8g2@^2.36.5

[env:esp32-c3-autotest]
extends = env:esp32-c3-oled
build_flags =
  ${env:esp32-c3-oled.build_flags}
  -D PLAYER_AUTOTEST=1
